services:
  - type: web
    name: notesgenai-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: notesgenai-backend
          envVarKey: RENDER_EXTERNAL_URL
        scope: build
